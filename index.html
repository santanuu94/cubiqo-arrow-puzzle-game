<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#311068" />
    <meta name="description" content="CUBIQO: Arrow Escape — A colourful directional logic puzzle game with 100 handcrafted levels and daily challenges." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>CUBIQO: Arrow Escape</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script>
      // Dev-only: clear legacy Service Workers/caches from other localhost projects
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./js/entry.js"></script>
  </body>
</html>
