<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#311068" />
    <meta name="description" content="CUBIQO: Arrow Escape — A colourful directional logic puzzle game with 100 handcrafted levels and daily challenges." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>CUBIQO: Arrow Escape</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Clear legacy Service Workers and caches from previous projects on localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var r of regs) { r.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          for (var k of keys) { caches.delete(k); }
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./js/entry.js"></script>
  </body>
</html>
